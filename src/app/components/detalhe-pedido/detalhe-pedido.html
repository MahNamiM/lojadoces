<div class="container my-4">
  <h2 class="mb-3">Pedido #{{ idPedido }}</h2>

  <ul class="list-group mb-3">
    <li class="list-group-item d-flex justify-content-between" *ngFor="let item of itens">
      <span>{{ item.quantidade }}x {{ item.nome }}</span>
      <span>R$ {{ (item.quantidade * item.preco).toFixed(2) }}</span>
    </li>
  </ul>

  <h4 class="text-end">Total: R$ {{ total.toFixed(2) }}</h4>
</div>
