<div class="container my-4">
  <h2 class="mb-4">Resultados para: "{{ termo }}"</h2>

  <div class="row g-4">
    <div class="col-6 col-md-4 col-lg-3" *ngFor="let produto of produtos">
      <div class="card h-100 card-doce">
        <img [src]="produto.imagem" class="card-img-top" [alt]="produto.nome">
        <div class="card-body text-center">
          <h6 class="card-title">{{ produto.nome }}</h6>
          <p class="card-text text-muted">R$ {{ produto.preco.toFixed(2) }}</p>
          <a [routerLink]="['/produto', produto.idProduto]" class="btn btn-sm btn-doce">
            Ver Produto
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
