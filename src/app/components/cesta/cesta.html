<div class="container my-4" id="paginaCesta">
  
  <h2 class="mb-4 text-center">Minha Cesta de Compras</h2>

  <div class="alert alert-info text-center" *ngIf="cesta.itens.length === 0">
    Sua cesta está vazia.
  </div>

  <div class="row g-3" *ngFor="let item of cesta.itens">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="row g-0 align-items-center">

          <div class="col-3 col-md-2 text-center">
            <img [src]="item.imagem" [alt]="item.nome" class="img-fluid rounded p-2">
          </div>

          <div class="col-5 col-md-6">
            <div class="card-body">
              <h5 class="card-title mb-1">{{ item.nome }}</h5>
              <p class="card-text text-muted mb-0">
                R$ {{ item.preco.toFixed(2) }} / unidade
              </p>
            </div>
          </div>

          <div class="col-2 col-md-2 d-flex align-items-center justify-content-center gap-2">
            <button class="btn btn-sm btn-outline-secondary" (click)="diminuir(item)">-</button>
            <span>{{ item.quantidade }}</span>
            <button class="btn btn-sm btn-outline-secondary" (click)="aumentar(item)">+</button>
          </div>

          <div class="col-2 col-md-2 text-end pe-3">
            <p class="fw-bold mb-1">R$ {{ item.subtotal.toFixed(2) }}</p>
            <button class="btn btn-sm btn-danger" (click)="remover(item)">Remover</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-4 border-top pt-3"
       *ngIf="cesta.itens.length > 0">
    <h4>Total: <span class="text-success">R$ {{ cesta.total.toFixed(2) }}</span></h4>
    <button class="btn btn-doce btn-lg">Finalizar Pedido</button>
  </div>
</div>
